[project]
name = "tele-bot"
version = "0.1.0"
description = "Telegram bot for forwarded media archiving with dedupe and pairing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "python-telegram-bot>=21.9,<22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
tele-bot = "tele_bot.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
