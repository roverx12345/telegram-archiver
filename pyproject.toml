[project]
name = "telegram-archiver"
version = "0.1.0"
description = "Telegram media archiver with bot and Saved Messages sources"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "python-telegram-bot>=21.9,<22.0",
    "telethon>=1.38,<2.0",
    "PySocks>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
telegram-archiver = "tele_bot.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
