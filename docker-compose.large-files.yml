services:
  bot:
    environment:
      LOCAL_BOT_API_URL: http://telegram-bot-api:8081
    depends_on:
      telegram-bot-api:
        condition: service_healthy

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    command:
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
    volumes:
      - ./telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/ >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
