name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -q

      - name: Compile sources
        run: |
          . .venv/bin/activate
          python -m compileall src tests
